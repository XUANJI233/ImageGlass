name: Build

on:
  push:
    branches: [v10]
  pull_request:
    branches: [v10]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build with MSBuild
        shell: pwsh
        run: |
          # Find MSBuild from Visual Studio (supports COM references)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuildPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1

          if (-not $msbuildPath) {
            Write-Error "MSBuild not found."
            exit 1
          }

          Write-Host "Using MSBuild: $msbuildPath"

          # Suppress non-critical warnings:
          #   NU1901/NU1902/NU1903 - NuGet vulnerability info
          #   NETSDK1233           - .NET 10 not supported in VS 2022 17.14
          #   IDISP*               - IDisposable analyzer
          #   CA1051               - visible instance fields
          # Use a response file to pass complex arguments (avoids PowerShell semicolon issues)
          $rspFile = Join-Path $env:RUNNER_TEMP "msbuild.rsp"
          @"
Source/ImageGlass/ImageGlass.csproj
/p:Configuration=Release
/p:Platform=x64
/p:NoWarn=NU1901;NU1902;NU1903;NETSDK1233;IDISP001;IDISP003;IDISP004;IDISP015;CA1051
/restore
"@ | Set-Content -Path $rspFile

          & $msbuildPath "@$rspFile"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageGlass-build
          path: Source/ImageGlass/bin/x64/Release/net10.0-windows10.0.17763.0/
