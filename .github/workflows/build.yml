name: Build

on:
  push:
    branches: [v10]
  pull_request:
    branches: [v10]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build with MSBuild
        shell: pwsh
        run: |
          # Find MSBuild from Visual Studio (supports COM references)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuildPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1

          if (-not $msbuildPath) {
            Write-Error "MSBuild not found."
            exit 1
          }

          Write-Host "Using MSBuild: $msbuildPath"

          # Get the .NET SDK path installed by setup-dotnet
          $dotnetRoot = $env:DOTNET_ROOT
          if (-not $dotnetRoot) { $dotnetRoot = "C:\Program Files\dotnet" }
          $sdkVersion = (& "$dotnetRoot\dotnet.exe" --version).Trim()
          Write-Host "Using .NET SDK: $sdkVersion from $dotnetRoot"

          # Force MSBuild to use this SDK instead of VS-bundled one
          $env:MSBuildSDKsPath = "$dotnetRoot\sdk\$sdkVersion\Sdks"

          # Build with /restore (MSBuild does its own restore with the correct SDK)
          & $msbuildPath Source/ImageGlass/ImageGlass.csproj /p:Configuration=Release /restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageGlass-build
          path: Source/ImageGlass/bin/Release/
