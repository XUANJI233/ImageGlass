name: Build

on:
  push:
    branches: [v10]
  pull_request:
    branches: [v10]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build with MSBuild
        shell: pwsh
        run: |
          # Find MSBuild from Visual Studio (supports COM references)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuildPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1

          if (-not $msbuildPath) {
            Write-Error "MSBuild not found."
            exit 1
          }

          Write-Host "Using MSBuild: $msbuildPath"

          # Build with /restore and specify Platform=x64
          & $msbuildPath Source/ImageGlass/ImageGlass.csproj /p:Configuration=Release /p:Platform=x64 /restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageGlass-build
          path: Source/ImageGlass/bin/Release/
